name: MCP Drift Check
description: Zero-execution MCP configuration security preflight for mutable package-runner dependencies
author: Tom Elias
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Optional MCP config path. Leave empty to scan known repo locations.
    required: false
    default: ''
  fail-on-high:
    description: Fail the job when HIGH findings are present.
    required: false
    default: 'true'
  share-public-result:
    description: Add Orynval public-repo links/badge to the job summary. Opt in only when repository-name disclosure is acceptable.
    required: false
    default: 'false'
outputs:
  sarif-file:
    description: Path to generated SARIF 2.1.0 report.
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: Scanner exit code before action policy is applied.
    value: ${{ steps.scan.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Install MCP Drift Check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"
    - name: Scan MCP configuration
      id: scan
      shell: bash
      env:
        # Inputs are passed through the environment and only ever expanded as
        # quoted shell variables, never interpolated into the script text.
        INPUT_SCAN_PATH: ${{ inputs.path }}
        SHARE_PUBLIC_RESULT: ${{ inputs.share-public-result }}
      run: |
        set +e
        sarif="$RUNNER_TEMP/mcp-drift-check.sarif"
        markdown="$RUNNER_TEMP/mcp-drift-check.md"
        annotations="$RUNNER_TEMP/mcp-drift-check-annotations.txt"
        if [ -n "$INPUT_SCAN_PATH" ]; then
          case "$INPUT_SCAN_PATH" in
            -*)
              echo "::error::mcp-drift-check: 'path' input must not start with '-'." >&2
              echo "exit-code=2" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            ..|../*|*/..|*/../*)
              echo "::error::mcp-drift-check: 'path' input must not contain '..' path segments." >&2
              echo "exit-code=2" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$INPUT_SCAN_PATH" != "$(printf '%s' "$INPUT_SCAN_PATH" | tr -d '[:cntrl:]')" ]; then
            echo "::error::mcp-drift-check: 'path' input must not contain control characters." >&2
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -e "$INPUT_SCAN_PATH" ]; then
            echo "::error::mcp-drift-check: 'path' input does not exist: $INPUT_SCAN_PATH" >&2
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mcp-drift-check scan --sarif "$sarif" --github-annotations "$annotations" --markdown -- "$INPUT_SCAN_PATH" > "$markdown"
          code=$?
        else
          mcp-drift-check scan-workspace --sarif "$sarif" --github-annotations "$annotations" --markdown > "$markdown"
          code=$?
        fi
        if [ -s "$markdown" ]; then
          cat "$markdown" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$SHARE_PUBLIC_RESULT" = "true" ]; then
          {
            echo ""
            echo "### Share / inspect in browser"
            echo "Repository-name disclosure is enabled for this run."
            echo "[Open the zero-execution public preflight for this repository](https://orynval.com/mcp-drift-check?repo=${GITHUB_REPOSITORY})"
            echo ""
            echo "[![MCP Drift Check](https://orynval.com/api/mcp-badge?repo=${GITHUB_REPOSITORY})](https://orynval.com/mcp-drift-check?repo=${GITHUB_REPOSITORY})"
            echo ""
            echo "Copy this scoped drift badge into your README:"
            echo '```markdown'
            echo "[![MCP Drift Check](https://orynval.com/api/mcp-badge?repo=${GITHUB_REPOSITORY})](https://orynval.com/mcp-drift-check?repo=${GITHUB_REPOSITORY})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -s "$markdown" ]; then
          cat "$markdown"
        fi
        if [ -s "$annotations" ]; then
          cat "$annotations"
        fi
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Fail on incomplete or invalid scan
      if: steps.scan.outputs.exit-code != '0' && steps.scan.outputs.exit-code != '1'
      shell: bash
      env:
        SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        echo "MCP Drift Check did not complete successfully (exit code $SCAN_EXIT_CODE)." >&2
        exit 1
    - name: Enforce HIGH finding policy
      if: inputs.fail-on-high == 'true' && steps.scan.outputs.exit-code == '1'
      shell: bash
      run: |
        echo "MCP Drift Check found HIGH severity mutable package references." >&2
        exit 1
