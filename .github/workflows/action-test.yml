name: Action Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify sharing is opt-in in action metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('action.yml').read_text()
          block = text.split('share-public-result:', 1)[1].split('outputs:', 1)[0]
          assert "default: 'false'" in block
          marker = 'if [ "' + '$' + '{{ inputs.share-public-result }}' + '" = "true" ]; then'
          start = text.index(marker)
          url = text.index('https://orynval.com/mcp-drift-check?repo=', start)
          end = text.index('\n        fi', start)
          assert start < url < end
          PY
      - name: Safe config through local action
        id: safe
        uses: ./
        with:
          path: examples/safe-config.json
          fail-on-high: 'false'
      - name: Verify safe SARIF exists
        run: test -s "${{ steps.safe.outputs.sarif-file }}"
      - name: Mutable config through local action
        id: mutable
        uses: ./
        with:
          path: examples/mutable-config.json
          fail-on-high: 'false'
      - name: Verify HIGH exit signal
        run: test "${{ steps.mutable.outputs.exit-code }}" = "1"
      - name: Invalid path fails closed
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          path: examples/does-not-exist.json
          fail-on-high: 'false'
      - name: Verify invalid scan is not reported as success
        run: test "${{ steps.invalid.outcome }}" = "failure"
      - name: Prepare workspace auto-discovery fixture
        run: cp examples/mutable-config.json .mcp.json
      - name: Auto-discovery uses workspace only
        id: workspace
        uses: ./
        with:
          fail-on-high: 'false'
      - name: Verify workspace HIGH exit signal
        run: |
          test "${{ steps.workspace.outputs.exit-code }}" = "1"
          rm .mcp.json
