[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-drift-check"
version = "0.2.6"
description = "Zero-execution MCP dependency drift preflight for AI agent configurations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Tom Elias"}]
keywords = ["mcp", "security", "ai-security", "supply-chain", "github-actions", "sarif", "devsecops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[project.scripts]
mcp-drift-check = "mcp_drift_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/tomelias10/mcp-drift-check"
Documentation = "https://github.com/tomelias10/mcp-drift-check#readme"
Issues = "https://github.com/tomelias10/mcp-drift-check/issues"
